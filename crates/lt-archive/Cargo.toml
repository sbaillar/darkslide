[package]
name = "lt-archive"
description = "Session archive (rsync to a folder or S3-compatible object storage), its scheduler, and the Amazon Photos folder hand-off"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
rustix = { version = "1.1.2", features = ["fs", "process"] }
reflink-copy = "0.1.28"
blake3.workspace = true
lt-fsutil = { path = "../lt-fsutil" }
lt-template = { path = "../lt-template" }
tempfile.workspace = true
# Object storage: SigV4 (HMAC-SHA256), Content-MD5, the S3 XML answers, key encoding.
sha2 = "0.10.9"
hmac = "0.12.1"
md-5 = "0.10.6"
base64 = "0.23.1"
roxmltree = "0.21.1"
percent-encoding = "2.3.2"

[features]
# The in-process mock S3 server, for other crates' tests.
mock = []

[dev-dependencies]

[lints]
workspace = true
