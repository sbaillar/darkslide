[package]
name = "ds-raw"
description = "RAW decode (native decoders, rawler fallback in process or through the rawler helper), embedded previews, EXIF metadata"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ds-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Unlinked temporary files as the rawler helper's stdin (MIT OR Apache-2.0).
tempfile.workspace = true
rayon.workspace = true
tracing.workspace = true
rawler = { version = "0.8.0", optional = true }
# DNG Deflate and lossy-JPEG tiles (both already in the tree; MIT/Apache/Zlib).
miniz_oxide = "0.9"
zune-core = "0.5"
zune-jpeg = "0.5"

[features]
default = []
# LGPL-2.1 fallback for formats and cameras the native decoders don't cover yet,
# linked in (docs/RAWDEC.md). Only the rawler helper (crates/ds-rawler) and tests
# turn it on; Darkslide itself runs that helper instead, when it is installed.
rawler = ["dep:rawler"]

[dev-dependencies]
ds-testdata = { path = "../ds-testdata" }
criterion.workspace = true
proptest.workspace = true
# Lossy DNG test tiles (MIT OR Apache-2.0).
jpeg-encoder = "0.7"

[[bench]]
name = "raw"
harness = false

[lints]
workspace = true
