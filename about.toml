# cargo-about: the licences of the crates linked into Darkslide.app (scripts/licenses.sh).
# Keep this list in step with deny.toml's [licenses] allow. LGPL-2.1 is accepted here for
# rawler's text; deny.toml (run first by scripts/licenses.sh) allows it for rawler only.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "IJG",
    "MPL-2.0",
    "LGPL-2.1",
]
# The app is built for Apple silicon Macs only.
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Darkslide's own crates (unpublished) are covered by LICENSE.
private = { ignore = true }
