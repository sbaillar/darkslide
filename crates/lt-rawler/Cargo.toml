[package]
name = "lt-rawler"
description = "luxtable-rawler: the separate program that runs the LGPL rawler decoder for Luxtable"
edition.workspace = true
version.workspace = true
# This crate's own source. The built program links rawler (LGPL-2.1) and is distributed
# under the LGPL's terms, apart from Luxtable; see README.md.
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "luxtable-rawler"
path = "src/main.rs"

[dependencies]
lt-raw = { path = "../lt-raw", features = ["rawler"] }

[dev-dependencies]
lt-core.workspace = true
lt-testdata = { path = "../lt-testdata" }
tempfile.workspace = true

[lints]
workspace = true
