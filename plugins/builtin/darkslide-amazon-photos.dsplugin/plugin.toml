# Amazon Photos as an optional, built-in integration: this plug-in is its switch.
# The code is native (the hand-off in crates/ds-archive); see docs/PLUGINS.md, "Native features".
manifest = 1
id = "darkslide.amazon-photos"
name = "Amazon Photos"
version = "1.0.0"
api = 1
authors = ["Darkslide"]
summary = "Copies your originals into the folder the Amazon Photos app backs up. No passwords, no private APIs."
permissions = ["files.write:amazon-photos-folder"]

[[contributes.native_feature]]
id = "amazon-photos"
name = "Amazon Photos"
contract = 1
uses = ["The folder the Amazon Photos app backs up (you choose it)"]
