[package]
name = "ds-import"
description = "Memory-card scan, verified single-pass copy, dedupe, journal/resume"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ds-core.workspace = true
ds-template = { path = "../ds-template" }
ds-fsutil = { path = "../ds-fsutil" }
ds-raw = { path = "../ds-raw", default-features = false }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
rustix = { version = "1.1.2", features = ["fs", "process"] }

[dev-dependencies]
ds-raw = { path = "../ds-raw", features = ["rawler"] }
tempfile.workspace = true
proptest.workspace = true
criterion.workspace = true
ds-testdata = { path = "../ds-testdata" }
ds-fsutil = { path = "../ds-fsutil" }

[[bench]]
name = "copy"
harness = false

[[bench]]
name = "hash"
harness = false

[lints]
workspace = true
