[package]
name = "ds-rawler"
description = "darkslide-rawler: the separate program that runs the LGPL rawler decoder for Darkslide"
edition.workspace = true
version.workspace = true
# This crate's own source. The built program links rawler (LGPL-2.1) and is distributed
# under the LGPL's terms, apart from Darkslide; see README.md.
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "darkslide-rawler"
path = "src/main.rs"

[dependencies]
ds-raw = { path = "../ds-raw", features = ["rawler"] }

[dev-dependencies]
ds-core.workspace = true
ds-testdata = { path = "../ds-testdata" }
tempfile.workspace = true

[lints]
workspace = true
