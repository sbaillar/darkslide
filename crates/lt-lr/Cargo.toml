[package]
name = "lt-lr"
description = "Adobe Lightroom Classic / Camera Raw import: read-only parsers for .lrcat catalogs, XMP sidecars and presets, mapping onto Luxtable sessions"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lt-core.workspace = true
lt-session = { path = "../lt-session" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
blake3.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
roxmltree = "0.21.1"
# Counts XML nesting before roxmltree parses (see src/limits.rs).
xmlparser = "0.13.6"

[dev-dependencies]
lt-testdata = { path = "../lt-testdata" }

[lints]
workspace = true
