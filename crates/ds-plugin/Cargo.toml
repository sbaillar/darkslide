[package]
name = "ds-plugin"
description = "Plug-in host: manifests, registry, install and trust, the WebAssembly runtime, and the ds-plugin CLI"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "ds-plugin"
path = "src/bin/ds-plugin.rs"

[dependencies]
ds-fsutil = { path = "../ds-fsutil" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
toml = "0.8.23"
semver = "1.0.28"
# Loop dispatch: the tail-call backend overflows the stack when LLVM skips sibling calls
# (instrumented coverage builds), so it is never selected.
wasmi = { version = "2.0.0", features = ["portable-dispatch"] }
wat = "1.261.0"
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
# .dsplugin zips: read with path checks, written by `ds-plugin pack --zip`.
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ds-core.workspace = true
bytemuck.workspace = true

[build-dependencies]
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
