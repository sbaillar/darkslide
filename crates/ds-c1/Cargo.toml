[package]
name = "ds-c1"
description = "Capture One session import: read-only parsers for .cosessiondb and .cos files, mapping onto Darkslide sessions"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ds-core.workspace = true
ds-fsutil = { path = "../ds-fsutil" }
ds-session = { path = "../ds-session" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
roxmltree = "0.21.1"
# Counts XML nesting before roxmltree parses (see src/xml.rs).
xmlparser = "0.13.6"
# The event reader (`stream`) checks nesting before a `Value` is built; it is behind
# the "unstable" feature, so the version is pinned exactly.
plist = { version = "=1.10.1", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
blake3.workspace = true

[dev-dependencies]
ds-testdata = { path = "../ds-testdata" }

[lints]
workspace = true
