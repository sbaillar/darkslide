# The archive as an optional, built-in integration: this plug-in is its switch.
# The code is native (crates/lt-archive, the app's Archive settings); see docs/PLUGINS.md,
# "Native features". Bundled plug-ins can be turned off, not removed.
manifest = 1
id = "luxtable.archive"
name = "Archive"
version = "1.0.0"
api = 1
authors = ["Luxtable"]
summary = "Copies each session to a folder on another disk or a NAS in the background, with rsync. Never deletes from the archive."
permissions = ["files.write:archive-folder"]

[[contributes.native_feature]]
id = "archive"
name = "Archive"
contract = 1
uses = ["The archive folder you choose (a disk or a mounted network share)", "rsync, run in the background"]
