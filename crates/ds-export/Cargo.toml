[package]
name = "ds-export"
description = "Export recipes, sizing, encoders (JPEG/TIFF/PNG, HEIC via hook), EXIF passthrough"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ds-core.workspace = true
ds-template = { path = "../ds-template" }
ds-fsutil = { path = "../ds-fsutil" }
ds-raw = { path = "../ds-raw" }
thiserror.workspace = true
rayon.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
mozjpeg = "0.10.13"
png = "0.18.1"
tiff = { version = "0.11.3", default-features = false }
rustix = { version = "1.1.2", features = ["fs"] }
# Little CMS, built from its vendored source (never a Homebrew dylib the app bundle lacks).
lcms2 = { version = "6.1.1", features = ["static"] }

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
kamadak-exif = "0.6.1"
peak_alloc = "0.3.0"
ds-testdata = { path = "../ds-testdata" }
jpeg-encoder = { version = "0.7.1", features = ["std"] }

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "proof"
harness = false

[lints]
workspace = true
