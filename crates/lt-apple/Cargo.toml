[package]
name = "lt-apple"
description = "Aperture and iPhoto library import: read-only parsers for Library.apdb and AlbumData.xml, applied through lt-lr's import engine"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lt-core.workspace = true
lt-lr = { path = "../lt-lr" }
thiserror.workspace = true
tempfile.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
# The event reader (`stream`) checks nesting before a `Value` is built; it is behind
# the "unstable" feature, so the version is pinned exactly (as in lt-c1).
plist = { version = "=1.10.1", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }

[dev-dependencies]
lt-session = { path = "../lt-session" }
blake3.workspace = true

[lints]
workspace = true
