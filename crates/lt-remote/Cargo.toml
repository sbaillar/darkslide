[package]
name = "lt-remote"
description = "The Mac side of the Luxtable link: paired mutual-TLS server, client library and CLI test client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lt-core.workspace = true
lt-session = { path = "../lt-session" }
lt-import = { path = "../lt-import" }
lt-fsutil = { path = "../lt-fsutil" }
lt-raw = { path = "../lt-raw", default-features = false }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# TLS 1.3 only, ring provider (no C toolchain beyond cc; no aws-lc cmake build).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# Parses device certificates for their key (already in the tree via rustls).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
spake2 = "0.4"

[features]
default = []
# Links rawler in (LGPL-2.1). Without it the `lt-remote` CLI uses the rawler helper
# named by LT_RAWLER_HELPER, if any (docs/RAWDEC.md).
rawler = ["lt-raw/rawler"]

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
