[package]
name = "lt-export"
description = "Export recipes, sizing, encoders (JPEG/TIFF/PNG, HEIC via hook), EXIF passthrough"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lt-core.workspace = true
lt-template = { path = "../lt-template" }
lt-fsutil = { path = "../lt-fsutil" }
lt-raw = { path = "../lt-raw", default-features = false }
thiserror.workspace = true
rayon.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
mozjpeg = "0.10.13"
png = "0.18.1"
tiff = { version = "0.11.3", default-features = false }
rustix = { version = "1.1.2", features = ["fs"] }
# Little CMS, built from its vendored source (never a Homebrew dylib the app bundle lacks).
lcms2 = { version = "6.1.1", features = ["static"] }

[dev-dependencies]
lt-raw = { path = "../lt-raw", features = ["rawler"] }
tempfile.workspace = true
serde_json.workspace = true
criterion.workspace = true
kamadak-exif = "0.6.1"
peak_alloc = "0.3.0"
lt-testdata = { path = "../lt-testdata" }
jpeg-encoder = { version = "0.7.1", features = ["std"] }

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "proof"
harness = false

[lints]
workspace = true
