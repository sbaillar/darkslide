[package]
name = "ds-ffi"
description = "UniFFI facade over the Darkslide Rust core, consumed by the SwiftUI app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# staticlib: linked into the Swift app. cdylib: read by uniffi-bindgen (library mode).
# lib: lets the Rust tests and the bindgen binary use the crate.
crate-type = ["lib", "staticlib", "cdylib"]
name = "ds_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]
# Links the LGPL rawler fallback into ds-raw (docs/RAWDEC.md). Darkslide.app leaves it
# out and runs the separate rawler helper (crates/ds-rawler) when the user installs it.
rawler = ["ds-raw/rawler"]

[dependencies]
ds-core.workspace = true
ds-raw = { path = "../ds-raw", default-features = false }
ds-session = { path = "../ds-session" }
ds-c1 = { path = "../ds-c1" }
ds-lr = { path = "../ds-lr" }
ds-ai = { path = "../ds-ai" }
ds-export = { path = "../ds-export", default-features = false }
ds-pipeline = { path = "../ds-pipeline" }
ds-merge = { path = "../ds-merge" }
bytemuck = "1.25.2"
ds-cache = { path = "../ds-cache" }
half = "2.7.1"
ds-template = { path = "../ds-template" }
mozjpeg = "0.10.13"
ds-archive = { path = "../ds-archive" }
ds-import = { path = "../ds-import", default-features = false }
ds-gphotos = { path = "../ds-gphotos" }
ds-plugin = { path = "../ds-plugin" }
ds-fsutil = { path = "../ds-fsutil" }
ds-remote = { path = "../ds-remote", default-features = false }
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
serde.workspace = true
serde_json.workspace = true
rustix = { version = "1", features = ["fs"] }
blake3 = { workspace = true, features = ["mmap", "rayon"] }
thiserror.workspace = true
rayon.workspace = true
libc = "0.2.189"
uniffi = "0.32.2"
futures-channel = "0.3.31"
# Export: EXIF (and GPS) of JPEG/HEIF originals.
kamadak-exif = "0.6.1"

[dev-dependencies]
# The tests decode synthetic Sony files, whose colour matrix comes from rawler's data.
ds-raw = { path = "../ds-raw", features = ["rawler"] }
tempfile.workspace = true
png = "0.18.1"
ds-testdata = { path = "../ds-testdata" }
criterion.workspace = true
futures-executor = "0.3.31"
rusqlite = { version = "0.37", features = ["bundled"] }
ds-gphotos = { path = "../ds-gphotos", features = ["mock"] }

[lints]
workspace = true

[[bench]]
name = "render"
harness = false
